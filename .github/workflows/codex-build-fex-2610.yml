name: Codex build FEX-2610 Windows components

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FEX_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out the FEX-2610 Bionic candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake file ninja-build python3 xz-utils

      - name: Install pinned llvm-mingw
        run: |
          set -euo pipefail
          archive=/tmp/llvm-mingw.tar.xz
          url=https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
          expected=cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
          curl -L --fail --retry 4 -o "$archive" "$url"
          echo "$expected  $archive" | sha256sum -c -
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf "$archive" -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          archive=/tmp/android-ndk-r29.zip
          url=https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          expected=87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b
          curl -L --fail --retry 4 -o "$archive" "$url"
          echo "$expected  $archive" | sha1sum -c -
          unzip -q "$archive" -d "$HOME/android-sdk"

      - name: Build wow64 and arm64ec FEX DLLs
        run: |
          set -euo pipefail
          for target in wow64 arm64ec; do
            case "$target" in
              wow64) triple=aarch64-w64-mingw32 ;;
              arm64ec) triple=arm64ec-w64-mingw32 ;;
            esac
            cmake -S . -B "build_${target}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=Data/CMake/toolchain_mingw.cmake \
              -DMINGW_TRIPLE="${triple}" \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows \
              -G Ninja \
              -DENABLE_LTO=False \
              -DENABLE_ASSERTIONS=False \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DBUILD_TESTING=False \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DTUNE_ARCH=generic \
              -DTUNE_CPU=none \
              -DRANGES_NATIVE=OFF
            cmake --build "build_${target}" --parallel 4
            DESTDIR="$PWD/stage_${target}" cmake --build "build_${target}" -t install
          done

      - name: Build Bionic UnixLib
        run: |
          set -euo pipefail
          ndk="$HOME/android-sdk/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64"
          "$ndk/bin/aarch64-linux-android29-clang++" \
            -std=c++17 -fPIC -O2 \
            -ffile-prefix-map="$PWD=/usr/src/arlinux/fex" \
            -c Source/Windows/UnixLib/FEXUnixLib.cpp \
            -o FEXUnixLib.o
          "$ndk/bin/aarch64-linux-android29-clang++" \
            -shared -static-libstdc++ -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            FEXUnixLib.o \
            -o libwow64fex.so
          cp libwow64fex.so libarm64ecfex.so

      - name: Package Bionic FEX component
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/files/lib/wine/aarch64-windows
          mkdir -p export/files/share/fex-emu
          cp stage_wow64/usr/lib/wine/aarch64-windows/libwow64fex.dll \
             export/files/lib/wine/aarch64-windows/libwow64fex.dll
          cp stage_arm64ec/usr/lib/wine/aarch64-windows/libarm64ecfex.dll \
             export/files/lib/wine/aarch64-windows/libarm64ecfex.dll
          cat > export/files/share/fex-emu/Config.json <<'EOF'
          {
            "Config": {
              "TSOEnabled": "1",
              "X87ReducedPrecision": "1",
              "VectorTSOEnabled": "0",
              "MemcpySetTSOEnabled": "0",
              "HalfBarrierTSOEnabled": "1",
              "MaxInst": "500",
              "Multiblock": "1"
            }
          }
          EOF
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("export")
          files = {}
          for relative in (
              "files/lib/wine/aarch64-windows/libarm64ecfex.dll",
              "files/lib/wine/aarch64-windows/libwow64fex.dll",
              "files/share/fex-emu/Config.json",
          ):
              files[relative] = hashlib.sha256((root / relative).read_bytes()).hexdigest()
          metadata = {
              "protocol": 1,
              "libc": "bionic",
              "fexCommit": os.environ["FEX_COMMIT"],
              "files": files,
          }
          (root / "bionic-runtime.json").write_text(json.dumps(metadata, sort_keys=True) + "\n")
          PY
          file export/files/lib/wine/aarch64-windows/*.dll
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("export/bionic-runtime.json").read_text())
          for relative in metadata["files"]:
              assert (Path("export") / relative).is_file(), relative
          PY
          tar --owner=0 --group=0 --mtime='@0' -czf export/runtime.tar.gz -C export \
            bionic-runtime.json \
            files/share/fex-emu/Config.json \
            files/lib/wine/aarch64-windows/libwow64fex.dll \
            files/lib/wine/aarch64-windows/libarm64ecfex.dll
          mkdir -p export/unixlib/files/lib/wine/aarch64-unix
          cp libwow64fex.so libarm64ecfex.so export/unixlib/files/lib/wine/aarch64-unix/
          tar --owner=0 --group=0 --mtime='@0' -czf export/unixlib.tar.gz -C export/unixlib \
            files/lib/wine/aarch64-unix/libwow64fex.so \
            files/lib/wine/aarch64-unix/libarm64ecfex.so
          sha256sum export/runtime.tar.gz | tee export/runtime.tar.gz.sha256
          sha256sum export/unixlib.tar.gz | tee export/unixlib.tar.gz.sha256

      - name: Upload runtime component
        uses: actions/upload-artifact@v4
        with:
          name: fex-2610-bionic-component
          path: |
            export/runtime.tar.gz
            export/runtime.tar.gz.sha256
            export/unixlib.tar.gz
            export/unixlib.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
